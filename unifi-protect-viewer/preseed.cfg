#### Unattended Debian install for a UniFi Protect Viewer kiosk.
#### Booted from custom.ipxe or netboot.xyz's "Specify preseed url..." entry.
#### The installer asks for the "localadmin" password. The Protect login is
#### entered on the viewer's setup screen at first boot.
#### Optional kernel arguments, passed through to install.sh:
####   upv_base                       URL of this folder (to fetch install.sh).
####                                  Defaults to cptechie/netboot.xyz-custom master.
####   upv_url, upv_username, upv_password   Protect login
#### WARNING: this wipes the first disk without asking.

# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string upv
d-i netcfg/get_domain string lan
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory /debian
d-i mirror/http/proxy string

# Accounts: no root password, localadmin gets sudo
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Local Admin
d-i passwd/username string localadmin

# Clock
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

# Partitioning: whole first disk, single partition
d-i partman/early_command string debconf-set partman-auto/disk "$(list-devices disk | head -n1)"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

# Packages
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Install the viewer, passing the upv_* kernel arguments through as UPV_* env vars
d-i preseed/late_command string \
  echo "export UPV_BASE='https://raw.githubusercontent.com/cptechie/netboot.xyz-custom/master/unifi-protect-viewer'" > /target/root/upv.env; \
  for w in $(cat /proc/cmdline); do \
    case "$w" in upv_*=*) \
      k=$(echo "$w" | cut -d= -f1 | tr a-z A-Z); \
      v=$(echo "$w" | cut -d= -f2-); \
      echo "export $k='$v'" >> /target/root/upv.env ;; \
    esac; \
  done; \
  in-target sh -c '. /root/upv.env && curl -fsSL "$UPV_BASE/install.sh" | bash; rm -f /root/upv.env'

d-i finish-install/reboot_in_progress note
